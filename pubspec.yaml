name: my_assistant
description: "MyAssistant - آب و هوا، تقویم و یادآوری"
publish_to: 'none'
version: 1.0.24+25

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # شبکه و اتصال اینترنت
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # ذخیره‌سازی دائمی (لوکیشن‌ها، کش آب‌وهوا، یادآوری‌ها)
  shared_preferences: ^2.2.3

  # اعلان‌های محلی (کار می‌کنند حتی وقتی برنامه بسته است)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # اجرای پس‌زمینه برای بروزرسانی آب‌وهوا / یادآوری بعد از ری‌استارت
  workmanager: ^0.5.2

  # تقویم شمسی و میلادی
  shamsi_date: ^1.1.1

  # تقویم قمری (هجری)
  hijri: ^3.0.0

  # فرمت اعداد فارسی
  intl: ^0.19.0

  # باز کردن لینک ایمیل و کانال تلگرام
  url_launcher: ^6.3.0

  # ویجت صفحه اصلی گوشی
  home_widget: ^0.6.0

  # اشتراک‌گذاری فایل پشتیبان و تصویر نمودار (نمودار ساز)
  share_plus: ^7.2.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/events.json
    - assets/images/app_banner.jpg
    - assets/images/app_icon.png
    - assets/images/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
